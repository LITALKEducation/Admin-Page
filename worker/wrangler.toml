name = "litalkapi"
account_id = "aacf06eb2a3dcbf4fc501455805047d0"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# LITALK hostname responsibilities
# --------------------------------
# api.litalkeducation.com
#   Primary/general API. Use for public website, Ask LITALK, admin operations,
#   service status and other API endpoints that are not specifically student
#   documents/files or financial/share links.
#
# istudent.litalkeducation.com
#   Student-facing origin. Reserve for Student Portal flows and student files /
#   documents. PUBLIC_FILES_ORIGIN below points here for shareable student files.
#
# payment.litalkeducation.com
#   Financial origin. Reserve for payment links, slips/receipts, financial
#   documents and other shareable finance URLs.
#
# go.litalkeducation.com
#   General LITALK share/short-link origin.
#
# These hostnames may route to the same Worker internally, but callers should
# use the hostname matching the resource's responsibility. The Worker must use
# the Host header to keep specialized domains scoped to their intended routes.

# ROUTES — configured in the Cloudflare dashboard, NOT here.
# The public blog article page must be routed through this Worker so shared
# links get real Open Graph previews.
#   litalkeducation.com/blog-post*
#   www.litalkeducation.com/blog-post*
#
# Primary API custom domain:
#   api.litalkeducation.com
# Student/document custom domain:
#   istudent.litalkeducation.com
# Short-link custom domains:
#   go.litalkeducation.com
#   payment.litalkeducation.com

[triggers]
crons = ["0 17 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "litalk"
database_id = "77c10f96-55ba-4830-abcc-cd3364fb22f7"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "files-litalk"

[[kv_namespaces]]
binding = "SHORTLINKS"
id = "6243b958ee0e4207932489e5197a449e"

[vars]
AUTH0_DOMAIN = "litalkeducation.us.auth0.com"
AUTH0_PORTAL_DOMAIN = "auth.litalkeducation.com"
AUTH0_AUDIENCE = "https://admin.litalkeducation.com/files-api"
AUTH0_EMAIL_CLAIM = "https://admin.litalkeducation.com/email"
AUTH0_NAME_CLAIM = "https://admin.litalkeducation.com/name"
ALLOWED_ORIGIN = "https://admin.litalkeducation.com,https://litalkeducation.com,https://www.litalkeducation.com"

# Student Portal files and official student documents only.
PUBLIC_FILES_ORIGIN = "https://istudent.litalkeducation.com"

# Share-link domains. `payment` is exclusively for finance-related links;
# ordinary shared links must use `go`.
SHORT_DOMAIN_GO = "go.litalkeducation.com"
SHORT_DOMAIN_PAYMENT = "payment.litalkeducation.com"

STRIPE_PLUS_PRICE_MONTHLY = "price_1Tz7vYACRT45Tj2qqkMB6Vkl"
STRIPE_PLUS_PRICE_TERM    = "price_1Tz7vZACRT45Tj2qRfYrjpS3"
STRIPE_PLUS_PRICE_YEARLY  = "price_1Tz7vYACRT45Tj2q1Sbiqemw"

STUDENT_EMAIL_DOMAIN = "litalkeducation.com"
AUTH0_DB_CONNECTION = "LITALK-Student"
AUTH0_STUDENT_REQUIRES_USERNAME = "true"
AUTH0_STAFF_CONNECTION = "Admin"
AUTH0_STAFF_REQUIRES_USERNAME = "true"
AUTH0_ADMIN_ROLE_ID = "rol_a4boy0hKsG2tABpo"
AUTH0_TEACHER_ROLE_ID = "rol_su0AELJNGqQB8Yk7"
AUTH0_STAFF_ROLE_ID = "rol_ZoCzC7ZFmbjuwemu"

# Secrets, NOT vars — set them with `npx wrangler secret put <NAME>`:
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# AUTH0_MGMT_CLIENT_ID, AUTH0_MGMT_CLIENT_SECRET
# GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_OAUTH_REFRESH_TOKEN
# GEMINI_API_KEY
