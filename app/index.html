    <!-- Installable to the home screen, scoped to /app/ so it opens the
         React panel rather than the legacy one at the site root. The
         service worker that already covers this path is the site-wide
         /sw.js (scope "/"): it serves HTML network-first, so a deploy is
         picked up immediately, and hashed assets cache-first, which is
         safe because a rebuild changes their filenames. A second worker
         scoped to /app/ would only duplicate that. -->
    <link rel="manifest" href="/app/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LITALK Admin" />
    <link rel="apple-touch-icon" href="/app/img/icon-192.png" />
    <script type="module" crossorigin src="/app/assets/index-BmmQFweL.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/jsx-runtime-bzQ4Vb5N.js">
    <link rel="stylesheet" crossorigin href="/app/assets/index-EYsurVlW.css">
  </head>
